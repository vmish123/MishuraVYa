[project]
name = "mishuravya"
version = "0.1.0"
description = "Лабораторная работа №14"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mishuravya = "mishuravya:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
